<!-- HEADER -->

    <a class="logo" href="index.html">ESPAÑOLES <span>EN LA</span> NBA</a>

    </div>
  </div>

<!-- CONTENIDO -->
<main>
  <section class="hero hero--page">
    <div class="hero-top">
      <div>
        <h1 class="hero-title ag-hero">El <em>Creador de gráficos</em></h1>
        <p class="hero-sub" id="hero-sub">Cargando datos…</p>
      </div>
    </div>
  </section>

  <section class="controles gr-controles" aria-label="Configuración del gráfico">
    <div class="gr-filtros">
      <label class="tmp-field">
        <span class="tmp-field-lbl">Tipo de gráfico</span>
        <select id="gr-tipo" class="sel">
          <option value="lineas">Líneas (evolución)</option>
          <option value="dispersion">Dispersión (relación)</option>
        </select>
      </label>
      <label class="tmp-field">
        <span class="tmp-field-lbl">Competición</span>
        <select id="gr-comp" class="sel">
          <option value="reg">Temporada regular</option>
          <option value="po">Playoffs</option>
        </select>
      </label>
      <label class="tmp-field" data-gr="lineas">
        <span class="tmp-field-lbl">Métrica (eje Y)</span>
        <select id="gr-m" class="sel"></select>
      </label>
      <label class="tmp-field" data-gr="lineas">
        <span class="tmp-field-lbl">Eje X</span>
        <select id="gr-ex" class="sel">
          <option value="temp">Temporada</option>
          <option value="n">Nº de temporada en la NBA</option>
          <option value="edad">Edad</option>
        </select>
      </label>
      <label class="tmp-field" data-gr="dispersion">
        <span class="tmp-field-lbl">Cada punto es</span>
        <select id="gr-u" class="sel">
          <option value="carrera">La carrera de un jugador</option>
          <option value="temporada">Una temporada de un jugador</option>
        </select>
      </label>
      <label class="tmp-field" data-gr="dispersion">
        <span class="tmp-field-lbl">Eje Y</span>
        <select id="gr-y" class="sel"></select>
      </label>
      <label class="tmp-field" data-gr="dispersion">
        <span class="tmp-field-lbl">Eje X</span>
        <select id="gr-x" class="sel"></select>
      </label>
      <label class="tmp-field">
        <span class="tmp-field-lbl">Desde</span>
        <select id="gr-desde" class="sel"></select>
      </label>
      <label class="tmp-field">
        <span class="tmp-field-lbl">Hasta</span>
        <select id="gr-hasta" class="sel"></select>
      </label>
      <label class="tmp-field">
        <span class="tmp-field-lbl">Mín. partidos</span>
        <select id="gr-min" class="sel"></select>
      </label>
    </div>

    <div class="gr-picker" id="gr-picker">
      <span class="tmp-field-lbl" id="gr-q-lbl">Jugadores <span class="gr-count" id="gr-count"></span></span>
      <div class="gr-picker-box">
        <div class="gr-chips" id="gr-chips"></div>
        <div class="gr-search">
          <input type="search" id="gr-q" class="gr-q" placeholder="Buscar jugador…" autocomplete="off" role="combobox" aria-labelledby="gr-q-lbl" aria-controls="gr-sugg" aria-expanded="false">
          <div class="gr-sugg" id="gr-sugg" role="listbox" hidden></div>
        </div>
      </div>
    </div>

    <div class="gr-opts">
      <button type="button" id="gr-ley" class="toggle-chip" aria-pressed="true">Leyenda</button>
      <button type="button" id="gr-ctx" class="toggle-chip" aria-pressed="true" data-gr="dispersion">Resto de españoles</button>
      <button type="button" id="gr-caras" class="toggle-chip" aria-pressed="true" data-gr="caras">Caras</button>
      <button type="button" id="gr-nom" class="toggle-chip" aria-pressed="true" data-gr="carrera">Nombres</button>
      <button type="button" id="gr-muestra" class="toggle-chip" aria-pressed="true" data-gr="pct">Ocultar % con poca muestra</button>
      <label class="gr-tfield">
        <span class="sr-only">Título del gráfico</span>
        <input type="text" id="gr-t" class="gr-tinput" maxlength="90" placeholder="Título automático">
      </label>
    </div>
  </section>

  <section class="gr-wrap" aria-label="Gráfico">
    <figure class="gr-figure">
      <figcaption class="gr-cap">
        <h2 class="gr-title" id="gr-title"></h2>
        <p class="gr-sub" id="gr-sub"></p>
      </figcaption>
      <div class="gr-legend" id="gr-legend"></div>
      <div class="gr-chart" id="gr-chart"><p class="gr-empty">Cargando…</p></div>
      <ul class="gr-warn" id="gr-warn" hidden></ul>
      <p class="gr-note" id="gr-note"></p>
    </figure>
    <div class="gr-actions">
      <label class="gr-fmt"><span class="sr-only">Formato de la imagen</span>
        <select id="gr-fmt" class="sel">
          <option value="h">Horizontal · 1600×900</option>
          <option value="v">Vertical · 1080×1350</option>
        </select>
      </label>
      <button type="button" class="efm-share-btn" onclick="grDownload()">Descargar PNG</button>
      <button type="button" class="efm-share-btn" onclick="grShare()" aria-label="Compartir el gráfico en X"><span class="efm-share-ico"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span> Compartir en X</button>
      <button type="button" class="efm-share-btn" onclick="grCopyLink(this)">Copiar enlace</button>
    </div>
    <details class="gr-datos">
      <summary>Ver los datos del gráfico</summary>
      <div class="gr-table" id="gr-table"></div>
    </details>
  </section>
</main>
